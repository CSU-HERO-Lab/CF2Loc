# S3D pose-query diffusion baseline, adapted only for the ZInD scene format.
project_name: "disco_model"
run_name: "pose_query_diffusion_zind_s3d_base"
use_wandb: true
gpu_ids: [0]
epochs: 30
batch_size: 8
val_batch_size: 4
num_workers: 4
log_every_n_steps: 10
precision: "32-true"
gradient_clip_val: 1.0
num_sanity_val_steps: 1

# Keep the historical e781938 localizer architecture unchanged.
dptv2_ckpt_path: "checkpoints/depth_anything_v2_vits.pth"
image_encoder: "vits"
freeze_image_backbone: true
image_token_grid: [6, 40]
diffusion_feature_dim: 128
diffusion_map_feature_dim: 64
diffusion_map_input_mode: "gray_edges"
diffusion_map_context_blocks: 2
diffusion_map_pretrained: false
diffusion_image_layers: 1
diffusion_denoiser_layers: 2
diffusion_num_heads: 4
diffusion_dropout: 0.1
diffusion_pose_fourier_bands: 4

diffusion_train_steps: 1000
diffusion_train_particles: 8
diffusion_val_particles: 64
diffusion_sample_steps: 20
diffusion_theta_loss_weight: 1.0
diffusion_clean_loss_weight: 0.1
diffusion_mode_sigma_m: 0.75
diffusion_mode_sigma_deg: 20.0

lr: 1.0e-4
min_lr: 1.0e-5
weight_decay: 1.0e-4

datasets:
  dataset_type: "zind"
  map_res: 0.01
  data_folder: "/home/ros/data/zind/disco_floc"
  data_splits: "/home/ros/data/zind/disco_floc/split.yaml"
  val_split: "val"
  floorplan_img_size: [256, 256]
  local_map_crop_size_meters: 5.0
  hard_negative:
    mode: "none"
  pose_aug:
    enable: false
